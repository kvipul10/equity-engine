archetype: fmcg
family: non_financial
damodaran_industries: ["Household Products", "Food Processing"]
evidence: "HINDUNILVR -> Household Products; NESTLEIND -> Food Processing in Damodaran's indname.xls (Jan 2026)"
how_to_read: |
  FMCG value comes from volume growth at stable gross margins, funded by suppliers and distributors (negative working capital).
  Split revenue growth into volume and price/mix: price-led growth without volume is borrowed from the future.
  Gross margin should hold through commodity swings (pass-through); A&P spend is the reinvestment in the brand, so a margin
  gain made by cutting A&P is low quality. Returns are very high because capital needs are tiny: watch for acquisitions diluting ROIC.

manual_kpis:
  - {id: volume_growth_pct, unit: "%", required: true, description: "Underlying volume growth for the year (as reported)", where: "Results press release / analyst call"}
  - {id: ad_promo_cr, unit: "Rs cr", required: true, description: "Advertising and promotion expense for the year", where: "Annual report, notes to other expenses"}
  - {id: commodity_index, unit: "index", required: false, description: "Analyst-chosen input-cost index level for the year (e.g. a WPI component matching the company's basket); document the choice in source_url", where: "Office of the Economic Adviser WPI / commodity price series"}

metrics_add:
  - {id: volume_growth, name: "Volume growth", pillar: growth, unit: pct, direction: higher, formula: "kpi('volume_growth_pct')",
     equation: "Underlying volume growth (reported)", meaning: "Real demand for the products."}
  - {id: price_mix_growth, name: "Price/mix growth", pillar: growth, unit: pp, direction: neutral, formula: "growth('f:revenue', 1) - kpi('volume_growth_pct')",
     equation: "Revenue growth - volume growth", meaning: "Growth from price increases and mix rather than volume."}
  - {id: ad_spend_pct, name: "A&P % of sales", pillar: margins, unit: pct, direction: neutral, formula: "kpi('ad_promo_cr') / f('revenue')",
     equation: "Advertising & promotion / revenue", meaning: "Brand reinvestment; cuts flatter margins at the expense of future volumes."}
  - {id: gross_margin_change_1y, name: "Gross margin change (1y)", pillar: margins, unit: pp, direction: higher, role: component,
     formula: "m('gross_margin') - m('gross_margin', 1)", equation: "Gross margin_t - gross margin_t-1", meaning: "Year-on-year gross-margin move."}
  - {id: commodity_change_1y, name: "Commodity index change (1y)", pillar: margins, unit: pct, direction: neutral, role: component,
     formula: "growth('kpi:commodity_index', 1)", equation: "Index_t / Index_t-1 - 1", meaning: "Input-cost inflation proxy."}
  - {id: gm_commodity_pass_through, name: "Gross-margin sensitivity to commodities", pillar: margins, unit: pp, direction: higher,
     formula: "slope_last('gross_margin_change_1y', 'commodity_change_1y', 5, 4) * 0.10",
     equation: "OLS slope of yearly gross-margin change on yearly commodity-index change over 5 years, x 10%",
     meaning: "Gross-margin points lost (negative) per 10% commodity rise: pricing power if close to zero."}

bands:
  nwc_days:
    green: 0
    red: 30
    source_type: indicative
    as_of: "2026-11-01"
    rationale: "Leading Indian FMCG companies run negative working capital (suppliers and distributors fund inventory); positive NWC above a month is unusual for the sector."
  volume_growth:
    red: 0.0
    green: 0.06
    source_type: indicative
    as_of: "2026-11-01"
    rationale: "Indian FMCG volume growth has run in low-to-mid single digits; 6%+ is strong, negative is a demand problem."
  gm_commodity_pass_through:
    red: -0.02
    green: -0.005
    source_type: indicative
    as_of: "2026-11-01"
    rationale: "Losing more than 2pp of gross margin per 10% commodity rise signals weak pricing power; under 0.5pp is strong pass-through."

flags:
  - id: FM01
    name: Price-led growth with falling volumes
    pillar: growth
    severity: medium
    applies: [fmcg, consumer_manufacturing]
    condition: "m('volume_growth') < 0 and m('price_mix_growth') > 0.08"
    values: {v: "m('volume_growth')", p: "m('price_mix_growth')"}
    explanation: >
      Volumes fell {{ v|pct }} while price/mix added {{ p|pp }}: growth is coming from price increases that consumers are resisting.
  - id: FM02
    name: Margin gain from cutting A&P
    pillar: margins
    severity: medium
    applies: [fmcg, consumer_manufacturing]
    condition: "chg('ad_spend_pct', 1) < -0.01 and chg('ebitda_margin', 1) > 0"
    values: {d: "chg('ad_spend_pct', 1)", e: "chg('ebitda_margin', 1)"}
    explanation: >
      A&P fell {{ d|pp }} of sales while EBITDA margin rose {{ e|pp }}: part of the margin gain is underinvestment in brands.
  - id: FM03
    name: Working capital turned positive
    pillar: capital_efficiency
    severity: low
    applies: [fmcg]
    condition: "m('nwc_days') > 0 and m('nwc_days', 1) <= 0"
    values: {now: "m('nwc_days')"}
    explanation: >
      Net working capital turned positive ({{ now|days }}): trade partners are no longer funding the business.
  - id: FM04
    name: Gross margin down while commodities fell
    pillar: margins
    severity: medium
    applies: [fmcg, consumer_manufacturing]
    condition: "m('commodity_change_1y') < -0.05 and m('gross_margin_change_1y') < -0.01"
    values: {c: "m('commodity_change_1y')", g: "m('gross_margin_change_1y')"}
    explanation: >
      Input costs fell {{ c|pct }} but gross margin dropped {{ g|pp }}: pricing or mix is deteriorating, not costs.
