# Scoring rules (explained in docs/methodology.md). All scores are 0-100; higher = better for the company.

level:
  min_peers_for_percentile: 4      # same-archetype companies with a value (incl. the company) needed for percentile mode
  rag_green_min: 66.666           # level RAG cut-offs (band mode maps red threshold -> 33.3, green threshold -> 66.7)
  rag_red_max: 33.334
  # band mode: score = 33.3 + 33.3 x (v - red) / (green - red), clipped to [0, 100] (mirrored for lower-is-better)
  # target metrics (green_low..green_high): 75 inside the green range, 33.3 at red_low/red_high, linear in between,
  # falling to 0 one amber-width beyond the red bound.

trend:
  window_years: 5                  # OLS slope over the last 5 annual values ...
  min_points: 3                    # ... needs at least 3
  scale_k: 0.10                    # score = 50 + 50 * tanh(direction * normalised_slope / k)
  improving_min: 0.03              # direction-adjusted normalised slope >= +3%/yr -> improving
  deteriorating_max: -0.03         # <= -3%/yr -> deteriorating
  # normalised slope = slope / max(|mean of window|, unit floor)

stability:
  window_years: 10
  min_points: 4
  cv_scale: 0.35                   # score = 100 * exp(-CV / cv_scale)
  stable_max: 0.15                 # CV <= 0.15 -> stable
  volatile_min: 0.40               # CV >= 0.40 -> volatile
  # CV = sd / max(|mean|, unit floor)

unit_floors:                       # floor for normalising trend and stability (avoids blow-ups near zero)
  pct: 0.05
  pp: 0.02
  x: 1.0
  days: 10.0
  ratio: 0.2
  inr_cr: 1.0
  score: 1.0
  count: 1.0

composite:
  weights: {level: 0.60, trend: 0.25, stability: 0.15}
  rag_green_min: 60
  rag_red_max: 40                  # composite < 40 -> red
  # Overrides: (1) a red level can never be green; (2) red level + deteriorating trend -> red.

pillar:
  rag_green_min: 60
  rag_red_max: 40
  high_flag_caps_at_amber: true    # a triggered high-severity flag in the pillar caps the pillar at amber
  default_metric_weight: 1.0

overall:
  rag_green_min: 60
  rag_red_max: 40
  high_flags_cap_at_amber: 2       # >= 2 triggered high-severity flags cap the overall RAG at amber

pillar_weights:
  non_financial:
    growth: 15
    margins: 15
    capital_efficiency: 10
    returns: 20
    cash_quality: 15
    balance_sheet: 10
    capital_allocation: 5
    valuation: 10
  bank_like:
    growth: 15
    margins: 15
    capital_efficiency: 5
    returns: 25
    cash_quality: 0
    balance_sheet: 20
    capital_allocation: 10
    valuation: 10
  insurance:
    growth: 15
    margins: 15
    capital_efficiency: 5
    returns: 25
    cash_quality: 0
    balance_sheet: 20
    capital_allocation: 10
    valuation: 10

metric_weights:                    # within-pillar weights (default 1.0)
  roic: 3
  roe: 2
  roic_wacc_spread: 2
  roe_ke_spread: 2
  incremental_roic_3y: 1.5
  revenue_cagr_5y: 2
  pat_cagr_5y: 1.5
  eps_cagr_5y: 1.5
  ebitda_margin: 2
  pat_margin: 1.5
  cfo_to_pat_5y: 2
  fcf_to_pat_5y: 2
  beneish_m_score: 1.5
  net_debt_to_ebitda: 2
  interest_cover: 2
  altman_z_india: 1.5
  equity_to_assets: 2
  roa: 2
  nii_to_assets: 2
  growth_minus_icg: 2
  pb_to_justified_pb: 1.5
  implied_minus_delivered_growth: 1.5

drivers:
  windows: [1, 3, 5]
  top_n: 5
  exactness_tolerance: 1.0e-6

# Report ranking (engine/report/findings.py). score = severity x confidence; lists are capped and de-duplicated.
# Session 4: a metric is scored only when the quantity it judges is material; below the gate it keeps its value, no RAG.
materiality:
  - metric: debt_vs_ebitda_growth
    gate: net_debt_to_ebitda
    min: 0.5
    reason: "debt is immaterial (net debt below 0.5x EBITDA): growth in leases or working-capital lines carries no credit risk"

report:
  severity:
    flag: {high: 1.0, medium: 0.6, low: 0.3}
    role: {scored: 1.0, root: 1.0, component: 0.67}
    pillar_weight_floor: 0.25          # pillar weight / max pillar weight, floored so zero-weight pillars can still appear
  confidence:
    years_full: 5                      # data coverage = min(1, years with data / 5)
    point_metric_coverage: 0.6         # metrics without an annual series (latest quarter, point-in-time)
    unverified_kpi: 0.8                # multiplier when an unverified manual KPI feeds the metric or flag
    source: {percentile: 1.0, external: 1.0, derived: 0.9, indicative: 0.6, rule_of_thumb: 0.6, none: 0.5}
  lists: {max_items: 6, max_per_pillar: 2, watch_fast_trend_score: 25}
  bullbear: {max_items: 8, from_lists: 4, cheap_percentile: 0.3, rich_percentile: 0.7, relative_gap: 0.2}
  driver_window_order: [3y, 5y, 1y]
  driver_tree_order: [bank_dupont, fin_roe, roe_dupont, roic_tree, eps_tree]
  estimate_note_categories: [exceptional, capex, lease, minority, stale, reclassification]
