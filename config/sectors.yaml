# Archetypes used in data/universe.csv -> economic family + Damodaran India industry mapping.
#
# family decides which metrics apply (see engine/registry.py tokens):
#   non_financial  -> token NF
#   bank_like      -> token BL (subtypes: bank -> BANK, nbfc -> NBFC)
#   insurance      -> token INS
#   (FIN = BL + INS, ALL = everything)
#
# damodaran_industries: industry names exactly as in Damodaran's India datasets (January 2026 update).
# Evidence for each mapping: the company's own industry in Damodaran's company list
# https://pages.stern.nyu.edu/~adamodar/pc/datasets/indname.xls (Last-Modified 2026-01-08), looked up on 2026-11-01.
# When several industries are listed, sector benchmarks are the simple average of the industry values.
# Caveat: Damodaran's industry figures are aggregates (sum of numerators / sum of denominators), so a dominant
# company influences its own benchmark (e.g. Bharti in Telecom (Wireless), NTPC in Power, HAL/BEL in Aerospace/Defense).

archetypes:
  bank:
    family: bank_like
    subtype: bank
    damodaran_industries: ["Bank (Money Center)"]
    evidence: "HDFCBANK, ICICIBANK, YESBANK -> Bank (Money Center)"
  nbfc:
    family: bank_like
    subtype: nbfc
    damodaran_industries: ["Financial Svcs. (Non-bank & Insurance)"]
    evidence: "BAJFINANCE -> Financial Svcs. (Non-bank & Insurance)"
  insurance:
    family: insurance
    damodaran_industries: ["Insurance (Life)"]
    evidence: "HDFCLIFE -> Insurance (Life)"
  it_services:
    family: non_financial
    damodaran_industries: ["Computer Services"]
    evidence: "TCS, INFY -> Computer Services"
  fmcg:
    family: non_financial
    damodaran_industries: ["Household Products", "Food Processing"]
    evidence: "HINDUNILVR -> Household Products; NESTLEIND -> Food Processing"
  consumer_manufacturing:
    family: non_financial
    damodaran_industries: ["Chemical (Specialty)"]
    evidence: "ASIANPAINT -> Chemical (Specialty)"
  metals:
    family: non_financial
    damodaran_industries: ["Steel"]
    evidence: "TATASTEEL -> Steel"
  cement:
    family: non_financial
    damodaran_industries: ["Construction Supplies"]
    evidence: "ULTRACEMCO -> Construction Supplies"
  auto:
    family: non_financial
    damodaran_industries: ["Auto & Truck"]
    evidence: "MARUTI -> Auto & Truck"
  pharma:
    family: non_financial
    damodaran_industries: ["Drugs (Pharmaceutical)"]
    evidence: "SUNPHARMA -> Drugs (Pharmaceutical)"
  capital_goods_defence:
    family: non_financial
    damodaran_industries: ["Aerospace/Defense"]
    evidence: "BEL, HAL -> Aerospace/Defense"
  real_estate:
    family: non_financial
    damodaran_industries: ["Real Estate (General/Diversified)"]
    evidence: "DLF -> Real Estate (General/Diversified)"
  utilities:
    family: non_financial
    damodaran_industries: ["Power"]
    evidence: "NTPC (NSEI:NTPC) -> Power"
  telecom:
    family: non_financial
    damodaran_industries: ["Telecom (Wireless)"]
    evidence: "BHARTIARTL -> Telecom (Wireless)"
  retail:
    family: non_financial
    damodaran_industries: ["Retail (Grocery and Food)"]
    evidence: "DMART -> Retail (Grocery and Food)"
  holdco:
    family: non_financial
    damodaran_industries: ["Diversified"]
    evidence: "ADANIENT is classified Retail (Distributors) by Damodaran; the holdco archetype is mapped to Diversified (conglomerates) because the archetype describes a multi-business incubator, not a distributor. Change here if you prefer the company-level classification."

# Used when a ticker is not in data/universe.csv and no --archetype is given.
default_archetype: default
default:
  family: non_financial
  damodaran_industries: ["Total Market (without financials)"]
  evidence: "fallback"
