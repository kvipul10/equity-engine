# Pre-registered expectations (Session 4). Written from cited analyst/press commentary BEFORE the engine is run or
# compared; committed before any comparison (see git log). Signals were chosen from the metric registry and flag list
# by meaning (docs/metrics.md, docs/flags.md), not from engine outputs.
#
# strengths: matched if any signal metric is GREEN at the as-of year.
# weaknesses: matched if any signal metric is RED, or AMBER with a deteriorating trend, or any signal flag fired.
# tag: financial (visible in the Screener financials) | kpi (needs a manual KPI) | qualitative (not a number).
# Disclosure: earlier sessions produced reports and parts of the TCS, HDFC Bank, DLF, Tata Steel and Yes Bank outputs
# were seen; every item below rests on the cited sources, not on those outputs.
version: 1
