# Session 4 adjudication of every engine headline item (top strengths, top weaknesses, high/medium flags) in
# validation/results.json for the test and blow-up companies, as of the final engine run.
# verdict: ok (right on the reported numbers and not contradicted by the cited sources) or false_alarm (wrong:
# a parsing or definition artefact, or contradicted by the pre-registered sources). cause uses the PLAN.md
# categories: parsing, metric definition, threshold, missing sector logic, missing data.
# Items that are signals of a matched pre-registered item of the same polarity are ok by construction.
# Holdout companies (ICICIBANK, INFY, NESTLEIND, HAL) are not adjudicated (their details stay closed).
